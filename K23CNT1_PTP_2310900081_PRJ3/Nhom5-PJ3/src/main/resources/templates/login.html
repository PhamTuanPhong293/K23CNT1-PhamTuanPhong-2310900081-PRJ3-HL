<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Đăng nhập</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        body{
            height:100vh;
            background:linear-gradient(135deg,#0d6efd,#4dabf7);
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
        }

        .login-card{

            width:430px;

            border:none;

            border-radius:18px;

            overflow:hidden;

            box-shadow:0 15px 35px rgba(0,0,0,.25);

            animation:show .8s;
        }

        @keyframes show{

            from{
                opacity:0;
                transform:translateY(40px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .card-header{

            background:#0d6efd;

            color:white;

            text-align:center;

            padding:30px;
        }

        .logo{

            width:80px;

            height:80px;

            border-radius:50%;

            background:white;

            color:#0d6efd;

            margin:auto;

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:40px;

            margin-bottom:15px;
        }

        .form-control{

            height:48px;
        }

        .input-group-text{

            background:white;
        }

        .btn-login{

            height:48px;

            font-size:18px;

            font-weight:bold;

            border-radius:10px;
        }

        .btn-login:hover{

            transform:scale(1.02);

            transition:.3s;
        }

        .footer{

            text-align:center;

            color:gray;

            margin-top:20px;

            font-size:14px;
        }

    </style>

</head>

<body>

<div class="card login-card">

    <div class="card-header">

        <div class="logo">

            <i class="bi bi-headset"></i>

        </div>

        <h3>Customer Support</h3>

        <p class="mb-0">
            Devmaster Management System
        </p>

    </div>

    <div class="card-body p-4">

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <form th:action="@{/login}"
              th:object="${user}"
              method="post">

            <div class="mb-3">

                <label class="form-label">

                    Username

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person"></i>

                    </span>

                    <input type="text"
                           class="form-control"
                           th:field="*{username}"
                           placeholder="Nhập tên đăng nhập"
                           required>

                </div>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>

                    <input type="password"
                           id="password"
                           class="form-control"
                           th:field="*{password}"
                           placeholder="Nhập mật khẩu"
                           required>

                    <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="showPassword()">

                        <i id="eye"
                           class="bi bi-eye"></i>

                    </button>

                </div>

            </div>

            <button
                    class="btn btn-primary btn-login w-100">

                <i class="bi bi-box-arrow-in-right"></i>

                Đăng nhập

            </button>

        </form>

        <div class="footer">

            © 2026 Devmaster Customer Support System

        </div>

    </div>

</div>

<script>

    function showPassword(){

        let pass=document.getElementById("password");

        let eye=document.getElementById("eye");

        if(pass.type==="password"){

            pass.type="text";

            eye.className="bi bi-eye-slash";

        }else{

            pass.type="password";

            eye.className="bi bi-eye";

        }

    }

</script>

</body>

</html>

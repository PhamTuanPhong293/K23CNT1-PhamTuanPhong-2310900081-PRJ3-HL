<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Quản lý nhân viên')"></head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container-fluid px-4 mt-4">

    <!-- Header với gradient -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 p-4 rounded"
         style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
        <div>
            <h2 class="fw-bold text-white mb-0">
                <i class="bi bi-person-badge-fill me-2"></i>Danh sách nhân viên
            </h2>
            <p class="text-white-50 mb-0">Quản lý thông tin nhân viên hỗ trợ</p>
        </div>
        <a th:href="@{/staff/new}" class="btn btn-light btn-lg shadow">
            <i class="bi bi-plus-circle me-2 text-success"></i>Thêm nhân viên
        </a>
    </div>

    <!-- Card -->
    <div class="card shadow-lg border-0 rounded">

        <div class="card-header py-3" style="background: #38f9d7;">
            <div class="d-flex justify-content-between align-items-center">
                <span class="text-white">
                    <i class="bi bi-table me-2"></i>Danh sách nhân viên
                </span>
                <span class="badge bg-light text-dark rounded-pill px-3 py-2">
                    <i class="bi bi-person-badge me-1"></i>
                    <span th:text="${#lists.size(staffList)}">0</span> nhân viên
                </span>
            </div>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 60px;" class="text-center">#ID</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>Số điện thoại</th>
                        <th>Chức vụ</th>
                        <th style="width: 180px;" class="text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="staff : ${staffList}">
                        <td class="text-center fw-bold text-primary" th:text="${staff.id}"></td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="avatar-circle bg-primary me-2">
                                    <span th:text="${#strings.substring(staff.fullName, 0, 1)}"></span>
                                </div>
                                <span th:text="${staff.fullName}"></span>
                            </div>
                        </td>
                        <td>
                            <a th:href="'mailto:' + ${staff.email}"
                               class="text-decoration-none text-primary"
                               th:text="${staff.email}"></a>
                        </td>
                        <td th:text="${staff.phone}"></td>
                        <td>
                            <span class="badge bg-info text-white px-3 py-2" th:text="${staff.position}"></span>
                        </td>
                        <td class="text-center">
                            <div class="action-buttons">
                                <a th:href="@{'/staff/edit/' + ${staff.id}}"
                                   class="btn-action btn-edit">
                                    <i class="bi bi-pencil"></i> Sửa
                                </a>
                                <a th:href="@{'/staff/delete/' + ${staff.id}}"
                                   class="btn-action btn-delete"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa nhân viên này?')">
                                    <i class="bi bi-trash"></i> Xóa
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(staffList)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox display-4 d-block mb-2"></i>
                            Chưa có nhân viên nào
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-footer bg-light border-0 d-flex justify-content-between align-items-center py-3">
            <span class="text-muted">
                <i class="bi bi-person-badge me-1 text-primary"></i>
                Tổng số: <strong class="text-primary" th:text="${#lists.size(staffList)}">0</strong> nhân viên
            </span>
            <span class="text-muted small">
                <i class="bi bi-clock me-1"></i>
                <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
            </span>
        </div>
    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

<style>
    .avatar-circle {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 14px;
        color: #fff;
        flex-shrink: 0;
    }
    .table tbody tr:nth-of-type(odd) {
        background-color: rgba(0,0,0,0.02);
    }
    .table tbody tr:hover {
        background-color: rgba(67, 233, 123, 0.08);
    }
    .badge {
        font-weight: 500;
        border-radius: 6px;
        font-size: 0.85rem;
    }

    /* ===== BUTTON ACTION - GỌN ĐẸP ===== */
    .btn-action {
        padding: 4px 14px;
        font-size: 0.78rem;
        border-radius: 20px;
        font-weight: 500;
        border: none;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-decoration: none;
        cursor: pointer;
    }
    .btn-action i {
        font-size: 0.8rem;
    }
    .btn-action:hover {
        transform: translateY(-2px);
        text-decoration: none;
    }

    /* Nút Sửa - Màu xanh dương */
    .btn-edit {
        background: #0d6efd;
        color: #fff;
    }
    .btn-edit:hover {
        background: #0a58ca;
        color: #fff;
        box-shadow: 0 4px 15px rgba(13, 110, 253, 0.4);
    }

    /* Nút Xóa - Màu đỏ */
    .btn-delete {
        background: #dc3545;
        color: #fff;
    }
    .btn-delete:hover {
        background: #b02a37;
        color: #fff;
        box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
    }

    .action-buttons {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        flex-wrap: nowrap;
    }
    @media (max-width: 576px) {
        .action-buttons {
            flex-direction: column;
            gap: 4px;
        }
        .btn-action {
            width: 100%;
            justify-content: center;
        }
    }
</style>

</body>

</html>

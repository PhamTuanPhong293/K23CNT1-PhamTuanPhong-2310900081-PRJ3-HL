<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark"
     th:fragment="navbar">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/}">

            Customer Support

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/}">

                        Trang chủ

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/tickets}">

                        Ticket

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/customers}">

                        Khách hàng

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/staff}">

                        Nhân viên

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/faq}">

                        FAQ

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/replies}">

                        Phản hồi

                    </a>

                </li>

            </ul>

            <ul class="navbar-nav">

                <li class="nav-item"
                    th:if="${session.loggedUser != null}">

                    <span class="navbar-text text-white me-3">

                        Xin chào,
                        <strong th:text="${session.loggedUser.fullName}"></strong>

                    </span>

                </li>

                <li class="nav-item"
                    th:if="${session.loggedUser != null}">

                    <a class="btn btn-danger btn-sm"
                       th:href="@{/logout}">

                        Đăng xuất

                    </a>

                </li>

                <li class="nav-item"
                    th:if="${session.loggedUser == null}">

                    <a class="btn btn-success btn-sm"
                       th:href="@{/login}">

                        Đăng nhập

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

</body>

</html>

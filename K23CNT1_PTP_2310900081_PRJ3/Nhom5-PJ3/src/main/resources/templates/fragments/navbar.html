<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm"
     th:fragment="navbar">

    <div class="container-fluid px-4">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-headset"></i>
            Devmaster Support
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Menu -->
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/customers}">
                        <i class="bi bi-people"></i>
                        Khách hàng
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tickets}">
                        <i class="bi bi-ticket"></i>
                        Ticket
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/staff}">
                        <i class="bi bi-person-badge"></i>
                        Nhân viên
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/faq}">
                        <i class="bi bi-question-circle"></i>
                        FAQ
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/replies}">
                        <i class="bi bi-chat-left-text"></i>
                        Phản hồi
                    </a>
                </li>

            </ul>

            <!-- User -->
            <ul class="navbar-nav align-items-center">

                <li class="nav-item me-3"
                    th:if="${session.loggedUser != null}">

                    <span class="text-white">

                        <i class="bi bi-person-circle fs-5"></i>

                        Xin chào,

                        <strong th:text="${session.loggedUser.fullName}">
                            Admin
                        </strong>

                    </span>

                </li>

                <li class="nav-item"
                    th:if="${session.loggedUser != null}">

                    <a class="btn btn-outline-light"
                       th:href="@{/logout}">

                        <i class="bi bi-box-arrow-right"></i>

                        Đăng xuất

                    </a>

                </li>

                <li class="nav-item"
                    th:if="${session.loggedUser == null}">

                    <a class="btn btn-success"
                       th:href="@{/login}">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Đăng nhập

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Danh sách Ticket')"></head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Danh sách Ticket</h2>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-primary">

        <tr>

            <th>ID</th>

            <th>Khách hàng</th>

            <th>Tiêu đề</th>

            <th>Trạng thái</th>

            <th>Ngày tạo</th>

            <th>Thao tác</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="ticket : ${tickets}">

            <td th:text="${ticket.id}"></td>

            <td th:text="${ticket.customer.fullName}"></td>

            <td th:text="${ticket.title}"></td>

            <td th:text="${ticket.status}"></td>

            <td th:text="${ticket.createdAt}"></td>

            <td>

                <a th:href="@{'/tickets/edit/' + ${ticket.id}}"
                   class="btn btn-warning btn-sm">

                    Sửa

                </a>

                <a th:href="@{'/tickets/delete/' + ${ticket.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa Ticket này?')">

                    Xóa

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>

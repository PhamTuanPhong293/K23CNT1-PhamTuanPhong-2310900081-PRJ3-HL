<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Dashboard')"></head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

    <div class="mb-4">

        <h2 class="fw-bold">

            Dashboard

        </h2>

        <p class="text-secondary">

            Customer Support Management System

        </p>

    </div>

    <div class="row">

        <div class="col-md-3 mb-3">

            <div class="card shadow border-0 bg-primary text-white">

                <div class="card-body">

                    <h5>Tổng khách hàng</h5>

                    <h1 th:text="${customerCount}">0</h1>

                    <i class="bi bi-people-fill fs-1"></i>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow border-0 bg-success text-white">

                <div class="card-body">

                    <h5>Ticket</h5>

                    <h1 th:text="${ticketCount}">0</h1>

                    <i class="bi bi-ticket-fill fs-1"></i>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow border-0 bg-warning text-dark">

                <div class="card-body">

                    <h5>Nhân viên</h5>

                    <h1 th:text="${staffCount}">0</h1>

                    <i class="bi bi-person-workspace fs-1"></i>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow border-0 bg-danger text-white">

                <div class="card-body">

                    <h5>FAQ</h5>

                    <h1 th:text="${faqCount}">0</h1>

                    <i class="bi bi-question-circle-fill fs-1"></i>

                </div>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-dark text-white">

                    Ticket theo trạng thái

                </div>

                <div class="card-body">

                    <h6>OPEN</h6>

                    <div class="progress mb-3">

                        <div class="progress-bar bg-success"

                             role="progressbar"

                             th:style="'width:'+${openPercent}+'%'"

                             th:text="${openCount}">

                        </div>

                    </div>

                    <h6>PROCESSING</h6>

                    <div class="progress mb-3">

                        <div class="progress-bar bg-warning"

                             role="progressbar"

                             th:style="'width:'+${processingPercent}+'%'"

                             th:text="${processingCount}">

                        </div>

                    </div>

                    <h6>CLOSED</h6>

                    <div class="progress">

                        <div class="progress-bar bg-danger"

                             role="progressbar"

                             th:style="'width:'+${closedPercent}+'%'"

                             th:text="${closedCount}">

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    Thông tin

                </div>

                <div class="card-body">

                    <p>

                        <b>Người đăng nhập:</b>

                    </p>

                    <p th:text="${session.loggedUser.fullName}"></p>

                    <hr>

                    <p>

                        Hệ thống quản lý chăm sóc khách hàng Devmaster.

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>

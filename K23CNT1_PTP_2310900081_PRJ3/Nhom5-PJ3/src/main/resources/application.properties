# ==========================
# Server
# ==========================
server.port=8080

# ==========================
# SQL Server - ?Ã S?A ENCODING
# ==========================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CustomerSupportDB;encrypt=false;trustServerCertificate=true;characterEncoding=UTF-8;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=Phong@123a.
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================
# JPA - THÊM ENCODING
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ==========================
# Thymeleaf
# ==========================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ==========================
# Encoding - ??Y ??
# ==========================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# ==========================
# Spring MVC
# ==========================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Thêm nhân viên')"></head>
<link rel="stylesheet" th:href="@{/css/style.css}">

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Thông tin nhân viên</h3>

        </div>

        <div class="card-body">

            <form th:action="@{/staff/save}"
                  th:object="${staff}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div class="mb-3">

                    <label class="form-label">

                        Họ và tên

                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{fullName}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Email

                    </label>

                    <input type="email"
                           class="form-control"
                           th:field="*{email}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Số điện thoại

                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{phone}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Chức vụ

                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{position}"
                           placeholder="Ví dụ: Support Staff">

                </div>

                <button class="btn btn-primary">

                    Lưu

                </button>

                <a th:href="@{/staff}"
                   class="btn btn-secondary">

                    Quay lại

                </a>

            </form>

        </div>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>

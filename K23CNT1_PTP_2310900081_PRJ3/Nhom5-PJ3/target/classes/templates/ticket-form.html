<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Tạo Ticket')"></head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Tạo yêu cầu hỗ trợ</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/tickets/save}"
                  th:object="${ticket}"
                  method="post">

                <!-- Khách hàng -->
                <div class="mb-3">

                    <label class="form-label">
                        Khách hàng
                    </label>

                    <select class="form-select"
                            name="customerId"
                            required>

                        <option value="">
                            -- Chọn khách hàng --
                        </option>

                        <option th:each="customer : ${customers}"
                                th:value="${customer.id}"
                                th:text="${customer.fullName}">
                        </option>

                    </select>

                </div>

                <!-- Tiêu đề -->
                <div class="mb-3">

                    <label class="form-label">
                        Tiêu đề
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{title}"
                           required>

                </div>

                <!-- Danh mục -->
                <div class="mb-3">

                    <label class="form-label">
                        Danh mục
                    </label>

                    <select class="form-select"
                            th:field="*{category}">

                        <option value="Hỗ trợ chung">
                            Hỗ trợ chung
                        </option>

                        <option value="Kỹ thuật">
                            Kỹ thuật
                        </option>

                        <option value="Thanh toán">
                            Thanh toán
                        </option>

                        <option value="Tài khoản">
                            Tài khoản
                        </option>

                    </select>

                </div>

                <!-- Độ ưu tiên -->
                <div class="mb-3">

                    <label class="form-label">
                        Độ ưu tiên
                    </label>

                    <select class="form-select"
                            th:field="*{priority}">

                        <option value="Thấp">Thấp</option>

                        <option value="Trung bình">Trung bình</option>

                        <option value="Cao">Cao</option>

                    </select>

                </div>

                <!-- Trạng thái -->
                <div class="mb-3">

                    <label class="form-label">
                        Trạng thái
                    </label>

                    <select class="form-select"
                            th:field="*{status}">

                        <option value="OPEN">
                            OPEN
                        </option>

                        <option value="PROCESSING">
                            PROCESSING
                        </option>

                        <option value="CLOSED">
                            CLOSED
                        </option>

                    </select>

                </div>

                <!-- Người xử lý -->
                <div class="mb-3">

                    <label class="form-label">
                        Nhân viên phụ trách
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{assignedTo}"
                           placeholder="Nhập tên nhân viên">

                </div>

                <!-- Nội dung -->
                <div class="mb-3">

                    <label class="form-label">
                        Nội dung
                    </label>

                    <textarea class="form-control"
                              rows="5"
                              th:field="*{description}">
                    </textarea>

                </div>

                <button class="btn btn-success">

                    Lưu Ticket

                </button>

                <a th:href="@{/tickets}"
                   class="btn btn-secondary">

                    Quay lại

                </a>

            </form>

        </div>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>

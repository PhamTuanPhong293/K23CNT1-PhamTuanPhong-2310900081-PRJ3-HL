<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Tạo Ticket')"></head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container-fluid px-4 mt-4">

    <!-- Header với gradient -->
    <div class="mb-4 p-4 rounded"
         style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
        <h2 class="fw-bold text-white mb-0">
            <i class="bi bi-ticket-plus me-2"></i>
            <span th:if="${ticket.id != null}">Cập nhật Ticket</span>
            <span th:if="${ticket.id == null}">Tạo Ticket mới</span>
        </h2>
        <p class="text-white-50 mb-0">Nhập thông tin yêu cầu hỗ trợ</p>
    </div>

    <div class="row">
        <div class="col-xl-8 col-lg-10">

            <div class="card shadow-lg border-0 rounded">
                <div class="card-header py-3" style="background: #4facfe;">
                    <h5 class="mb-0 text-white">
                        <i class="bi bi-info-circle me-2"></i>
                        Thông tin Ticket
                    </h5>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/tickets/save}"
                          th:object="${ticket}"
                          method="post">

                        <!-- Khách hàng -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Khách hàng <span class="text-danger">*</span>
                            </label>
                            <select class="form-select form-select-lg"
                                    name="customerId"
                                    required>
                                <option value="">-- Chọn khách hàng --</option>
                                <option th:each="customer : ${customers}"
                                        th:value="${customer.id}"
                                        th:text="${customer.fullName}">
                                </option>
                            </select>
                        </div>

                        <!-- Tiêu đề -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Tiêu đề <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control form-control-lg"
                                   th:field="*{title}"
                                   placeholder="Nhập tiêu đề Ticket"
                                   required>
                        </div>

                        <!-- Danh mục -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Danh mục
                            </label>
                            <select class="form-select form-select-lg"
                                    th:field="*{category}">
                                <option value="Hỗ trợ chung">Hỗ trợ chung</option>
                                <option value="Kỹ thuật">Kỹ thuật</option>
                                <option value="Thanh toán">Thanh toán</option>
                                <option value="Tài khoản">Tài khoản</option>
                                <option value="Khác">Khác</option>
                            </select>
                        </div>

                        <!-- Độ ưu tiên -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Độ ưu tiên
                            </label>
                            <select class="form-select form-select-lg"
                                    th:field="*{priority}">
                                <option value="Thấp">Thấp</option>
                                <option value="Trung bình">Trung bình</option>
                                <option value="Cao">Cao</option>
                            </select>
                        </div>

                        <!-- Trạng thái -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Trạng thái
                            </label>
                            <select class="form-select form-select-lg"
                                    th:field="*{status}">
                                <option value="OPEN">OPEN</option>
                                <option value="PROCESSING">PROCESSING</option>
                                <option value="CLOSED">CLOSED</option>
                            </select>
                        </div>

                        <!-- Người xử lý -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Nhân viên phụ trách
                            </label>
                            <input type="text"
                                   class="form-control form-control-lg"
                                   th:field="*{assignedTo}"
                                   placeholder="Nhập tên nhân viên">
                        </div>

                        <!-- Nội dung -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Nội dung
                            </label>
                            <textarea class="form-control"
                                      rows="5"
                                      th:field="*{description}"
                                      placeholder="Mô tả chi tiết vấn đề..."></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-success btn-lg px-5">
                                <i class="bi bi-check-lg me-2"></i>
                                <span th:if="${ticket.id != null}">Cập nhật</span>
                                <span th:if="${ticket.id == null}">Lưu</span>
                            </button>
                            <a th:href="@{/tickets}" class="btn btn-secondary btn-lg px-4">
                                <i class="bi bi-arrow-left me-2"></i>Quay lại
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>

        <!-- Sidebar -->
        <div class="col-xl-4 col-lg-10 mt-4 mt-xl-0">
            <div class="card shadow-lg border-0 rounded">
                <div class="card-header py-3" style="background: #f5576c;">
                    <h6 class="mb-0 text-white fw-bold">
                        <i class="bi bi-lightbulb me-2"></i>Lưu ý
                    </h6>
                </div>
                <div class="card-body">
                    <ul class="list-unstyled">
                        <li class="mb-2">
                            <i class="bi bi-check-circle-fill text-success me-2"></i>
                            Chọn đúng khách hàng
                        </li>
                        <li class="mb-2">
                            <i class="bi bi-check-circle-fill text-success me-2"></i>
                            Tiêu đề ngắn gọn, rõ ràng
                        </li>
                        <li class="mb-2">
                            <i class="bi bi-check-circle-fill text-success me-2"></i>
                            Phân loại đúng danh mục
                        </li>
                        <li class="mb-2">
                            <i class="bi bi-check-circle-fill text-success me-2"></i>
                            Đặt mức ưu tiên phù hợp
                        </li>
                    </ul>
                    <div class="alert alert-info mb-0">
                        <i class="bi bi-info-circle me-1"></i>
                        Các trường có <span class="text-danger">*</span> là bắt buộc
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>

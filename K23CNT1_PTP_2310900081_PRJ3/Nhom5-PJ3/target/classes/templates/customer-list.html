<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Danh sách khách hàng')"></head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-3">

        <h2>Danh sách khách hàng</h2>

        <a th:href="@{/customers/new}"
           class="btn btn-success">

            + Thêm khách hàng

        </a>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Họ và tên</th>

            <th>Email</th>

            <th>Thao tác</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="customer : ${customers}">

            <td th:text="${customer.id}"></td>

            <td th:text="${customer.fullName}"></td>

            <td th:text="${customer.email}"></td>

            <td>

                <a th:href="@{'/customers/edit/' + ${customer.id}}"
                   class="btn btn-warning btn-sm">

                    Sửa

                </a>

                <a th:href="@{'/customers/delete/' + ${customer.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa khách hàng này?')">

                    Xóa

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>
